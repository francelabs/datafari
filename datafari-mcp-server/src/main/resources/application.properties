# Server
server.port=8090
  
  # Application
spring.application.name=datafari-mcp-server
  
  # MCP
spring.ai.mcp.server.name=Datafari MCP Server
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.annotation-scanner.enabled=true

# MCP transport
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
  
  # Datafari
datafari.base-url=https://127.0.0.1
  
  # Logging
logging.level.root=INFO
logging.level.com.francelabs.datafari.mcp=DEBUG